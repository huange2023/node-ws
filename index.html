<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名言时钟 - 时光与智慧</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #000;
            padding: 20px;
        }
        
        /* 背景图片样式 */
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: opacity 1s ease;
        }
        
        /* 背景遮罩层，增强文字可读性 */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        
        /* 主容器 */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1s ease;
        }
        
        /* 标题样式 */
        .title {
            font-size: 2.8rem;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .title i {
            margin-right: 15px;
            color: #f0c674;
        }
        
        /* 日期和时间样式 */
        .datetime-container {
            margin-bottom: 40px;
        }
        
        .date {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 300;
            color: #e0e0e0;
        }
        
        .time {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
            color: #fff;
        }
        
        .weekday {
            font-size: 1.8rem;
            font-weight: 300;
            color: #f0c674;
            font-style: italic;
        }
        
        /* 名言样式 */
        .quote-container {
            padding: 30px;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-top: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s ease;
        }
        
        .quote {
            font-size: 1.6rem;
            line-height: 1.5;
            font-style: italic;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        
        .author {
            font-size: 1.2rem;
            color: #f0c674;
            font-weight: 500;
            text-align: right;
        }
        
        /* 名言来源标签 */
        .quote-tag {
            display: inline-block;
            background-color: rgba(240, 198, 116, 0.2);
            color: #f0c674;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border: 1px solid rgba(240, 198, 116, 0.3);
        }
        
        /* 刷新按钮 */
        .refresh-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .refresh-btn:hover {
            background-color: rgba(240, 198, 116, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .refresh-btn i {
            margin-right: 8px;
        }
        
        /* 页脚信息 */
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .bing-info {
            display: flex;
            align-items: center;
        }
        
        .bing-info i {
            margin-right: 8px;
            color: #00809d;
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            
            .date {
                font-size: 1.8rem;
            }
            
            .time {
                font-size: 3.5rem;
                letter-spacing: 3px;
            }
            
            .weekday {
                font-size: 1.5rem;
            }
            
            .quote {
                font-size: 1.3rem;
            }
            
            .container {
                padding: 30px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .date {
                font-size: 1.5rem;
            }
            
            .time {
                font-size: 2.8rem;
                letter-spacing: 2px;
            }
            
            .weekday {
                font-size: 1.3rem;
            }
            
            .quote {
                font-size: 1.1rem;
            }
            
            .footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景图片 -->
    <div id="background"></div>
    <div id="overlay"></div>
    
    <!-- 主内容区 -->
    <div class="container">
        <h1 class="title"><i class="fas fa-clock"></i>名言时钟</h1>
        
        <div class="datetime-container">
            <div class="date" id="date">2023年10月15日</div>
            <div class="time" id="time">00:00:00</div>
            <div class="weekday" id="weekday">星期日</div>
        </div>
        
        <!-- 名言标签 -->
        <div class="quote-tag" id="quote-tag">中外名言</div>
        
        <!-- 名言区域 -->
        <div class="quote-container">
            <div class="quote" id="quote">时间是一切财富中最宝贵的财富。</div>
            <div class="author" id="author">—— 德奥弗拉斯多</div>
        </div>
        
        <!-- 刷新按钮 -->
        <button class="refresh-btn" id="refresh-btn">
            <i class="fas fa-sync-alt"></i> 刷新名言
        </button>
        
        <!-- 页脚信息 -->
        <div class="footer">
            <div class="bing-info">
                <i class="fab fa-microsoft"></i>
                <span>背景图源：Bing每日精选</span>
            </div>
            <div>名言时钟 | 每日智慧</div>
        </div>
    </div>

    <script>
        // 名言库
        const quotes = [
            {quote: "时间是一切财富中最宝贵的财富。", author: "德奥弗拉斯多", tag: "外国名言"},
            {quote: "逝者如斯夫，不舍昼夜。", author: "孔子", tag: "中国名言"},
            {quote: "时间就是生命，时间就是速度，时间就是力量。", author: "郭沫若", tag: "中国名言"},
            {quote: "时间是一个伟大的作者，它会给每个人写出完美的结局来。", author: "卓别林", tag: "外国名言"},
            {quote: "人生天地之间，若白驹过隙，忽然而已。", author: "庄子", tag: "中国名言"},
            {quote: "你热爱生命吗？那么别浪费时间，因为时间是构成生命的材料。", author: "富兰克林", tag: "外国名言"},
            {quote: "明日复明日，明日何其多，我生待明日，万事成蹉跎。", author: "钱鹤滩", tag: "中国名言"},
            {quote: "时间的步伐有三种：未来姗姗来迟，现在像箭一样飞逝，过去永远静立不动。", author: "席勒", tag: "外国名言"},
            {quote: "盛年不重来，一日难再晨。及时当勉励，岁月不待人。", author: "陶渊明", tag: "中国名言"},
            {quote: "抛弃时间的人，时间也抛弃他。", author: "莎士比亚", tag: "外国名言"},
            {quote: "吾生也有涯，而知也无涯。", author: "庄子", tag: "中国名言"},
            {quote: "光阴可惜，譬诸逝水，当博览机要，以济功业。", author: "颜之推", tag: "中国名言"},
            {quote: "合理安排时间，就等于节约时间。", author: "培根", tag: "外国名言"},
            {quote: "天可补，海可填，南山可移。日月既往，不可复追。", author: "曾国藩", tag: "中国名言"},
            {quote: "时间就像海绵里的水，只要愿挤，总还是有的。", author: "鲁迅", tag: "中国名言"},
            {quote: "在所有批评家中，最伟大、最正确、最天才的是时间。", author: "别林斯基", tag: "外国名言"},
            {quote: "志士惜年，贤人惜日，圣人惜时。", author: "魏源", tag: "中国名言"},
            {quote: "时间最不偏私，给任何人都是二十四小时；时间也最偏私，给任何人都不是二十四小时。", author: "赫胥黎", tag: "外国名言"},
            {quote: "莫等闲，白了少年头，空悲切。", author: "岳飞", tag: "中国名言"},
            {quote: "时间的无声的脚步，不会因为我们有许多事情需要处理而稍停片刻。", author: "莎士比亚", tag: "外国名言"},
            {quote: "少年易老学难成，一寸光阴不可轻。", author: "朱熹", tag: "中国名言"},
            {quote: "时间是世界上一切成就的土壤。时间给空想者痛苦，给创造者幸福。", author: "麦金西", tag: "外国名言"},
            {quote: "不饱食以终日，不弃功于寸阴。", author: "葛洪", tag: "中国名言"},
            {quote: "从不浪费时间的人，没有工夫抱怨时间不够。", author: "杰弗逊", tag: "外国名言"},
            {quote: "一年之计在于春，一日之计在于晨。", author: "萧绎", tag: "中国名言"}
        ];
        
        // 获取DOM元素
        const dateElement = document.getElementById('date');
        const timeElement = document.getElementById('time');
        const weekdayElement = document.getElementById('weekday');
        const quoteElement = document.getElementById('quote');
        const authorElement = document.getElementById('author');
        const quoteTagElement = document.getElementById('quote-tag');
        const refreshButton = document.getElementById('refresh-btn');
        const backgroundElement = document.getElementById('background');
        
        // 星期映射
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        // 更新日期和时间
        function updateDateTime() {
            const now = new Date();
            
            // 格式化日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            dateElement.textContent = `${year}年${month}月${day}日`;
            
            // 格式化时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeElement.textContent = `${hours}:${minutes}:${seconds}`;
            
            // 更新星期
            const weekday = now.getDay();
            weekdayElement.textContent = weekdays[weekday];
        }
        
        // 随机选择一条名言
        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            return quotes[randomIndex];
        }
        
        // 显示随机名言
        function showRandomQuote() {
            const randomQuote = getRandomQuote();
            quoteElement.textContent = randomQuote.quote;
            authorElement.textContent = `—— ${randomQuote.author}`;
            quoteTagElement.textContent = randomQuote.tag;
            
            // 添加淡入效果
            quoteElement.style.opacity = 0;
            authorElement.style.opacity = 0;
            
            setTimeout(() => {
                quoteElement.style.transition = 'opacity 0.5s ease';
                authorElement.style.transition = 'opacity 0.5s ease';
                quoteElement.style.opacity = 1;
                authorElement.style.opacity = 1;
            }, 10);
        }
        
        // 获取Bing每日精选图片
        async function fetchBingBackground() {
            try {
                // 使用Bing每日图片API
                const response = await fetch('https://bing.biturl.top/?resolution=1920&format=json&index=0&mkt=zh-CN');
                const data = await response.json();
                
                if (data && data.url) {
                    // 创建新背景图片
                    const img = new Image();
                    img.onload = function() {
                        // 图片加载完成后设置为背景
                        backgroundElement.style.backgroundImage = `url(${data.url})`;
                    };
                    img.src = data.url;
                } else {
                    // 如果API失败，使用备用图片
                    setFallbackBackground();
                }
            } catch (error) {
                console.error('获取Bing背景图片失败:', error);
                setFallbackBackground();
            }
        }
        
        // 设置备用背景
        function setFallbackBackground() {
            // 使用一系列高质量自然风景图片作为备用
            const fallbackImages = [
                'https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80',
                'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80',
                'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80',
                'https://images.unsplash.com/photo-1439066615861-d1af74d74000?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80'
            ];
            
            const randomIndex = Math.floor(Math.random() * fallbackImages.length);
            backgroundElement.style.backgroundImage = `url(${fallbackImages[randomIndex]})`;
        }
        
        // 页面加载时初始化
        function init() {
            updateDateTime();
            showRandomQuote();
            fetchBingBackground();
            
            // 每秒更新时间
            setInterval(updateDateTime, 1000);
            
            // 每30分钟更新一次背景图片
            setInterval(fetchBingBackground, 30 * 60 * 1000);
        }
        
        // 绑定刷新按钮事件
        refreshButton.addEventListener('click', showRandomQuote);
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
